name: Feature request
description: Suggest a new effect, export format or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the motivation?
      description: What are you trying to do that the studio can't do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Reference images or shaders help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New effect / shader
        - Export format
        - Palette / presets
        - Studio UI
        - Documentation
        - Other
